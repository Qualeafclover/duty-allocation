services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: duty
      POSTGRES_PASSWORD: password
      POSTGRES_DB: duty
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://duty:password@db:5432/duty
      # Poll for file changes so --reload also works when the repo is on the
      # Windows drive (/mnt/c), where file change events don't reach Docker
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/code/backend
      - ./frontend:/code/frontend

volumes:
  pgdata:
