<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>マイページ | 納得のできる抽選システム</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- ログインを確認できるまで表示しない -->
    <div class="app-shell" id="content" hidden>
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div><strong>マイページ</strong><small>USER PAGE</small></div>
            </div>

            <div class="nav-label">メニュー</div>
            <a class="nav-item active" href="/home.html"><span class="nav-icon">⌂</span>マイページ</a>

            <div class="sidebar-bottom">
                <div class="profile-card">
                    <div class="avatar" id="avatar"></div>
                    <div><strong id="badge-name"></strong><small id="badge-login-id"></small></div>
                    <span class="status-dot"></span>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button class="mobile-menu" id="mobile-menu" type="button" aria-label="メニュー">☰</button>
                <div class="breadcrumb">ユーザー <span>/</span> <strong>マイページ</strong></div>
                <div class="topbar-right">
                    <span class="user-pill"><i></i> ログイン中</span>
                    <button type="button" class="secondary-btn" id="logout-button">ログアウト</button>
                </div>
            </header>

            <section class="page active">
                <div class="page-heading">
                    <div>
                        <p class="eyebrow">MY PAGE</p>
                        <h1 id="welcome"></h1>
                        <p class="subheading">あなたのポイントとメンバーの状況を確認できます。</p>
                    </div>
                </div>

                <div class="stats-grid">
                    <article class="stat-card">
                        <div class="stat-top"><span>あなたのポイント</span><span class="stat-icon blue">★</span></div>
                        <strong id="points"></strong>
                        <small>現在のポイント</small>
                    </article>
                    <article class="stat-card">
                        <div class="stat-top"><span>ユーザーID</span><span class="stat-icon purple">♙</span></div>
                        <strong class="stat-text" id="login-id"></strong>
                        <small>ログインに使う ID</small>
                    </article>
                    <article class="stat-card">
                        <div class="stat-top"><span>セッション有効期限</span><span class="stat-icon green">◷</span></div>
                        <strong class="stat-text" id="expires-dt"></strong>
                        <small>ログイン日時: <span id="login-dt"></span></small>
                    </article>
                </div>

                <div class="content-card">
                    <div class="table-toolbar">
                        <div>
                            <h2>メンバー</h2>
                            <p><span id="member-count">0</span> 人のメンバー</p>
                        </div>
                    </div>
                    <ul class="member-list" id="users"></ul>
                </div>
            </section>
        </main>
    </div>

    <script>
        const formatDate = (value) => new Date(value).toLocaleString("ja-JP");

        function memberRow(user, me) {
            const item = document.createElement("li");
            if (user.id === me.id) item.className = "me";

            const avatar = document.createElement("span");
            avatar.className = "user-avatar";
            avatar.textContent = user.name.slice(0, 1);

            const name = document.createElement("span");
            name.className = "member-name";
            name.textContent = user.name;

            const points = document.createElement("span");
            points.className = "points";
            points.textContent = `${user.task_points} pt`;

            item.append(avatar, name);
            if (user.id === me.id) {
                const tag = document.createElement("span");
                tag.className = "you-tag";
                tag.textContent = "あなた";
                item.append(tag);
            }
            item.append(points);
            return item;
        }

        async function load() {
            const response = await fetch("/api/me");
            if (!response.ok) {
                // 未ログイン、またはセッションの期限切れ
                location.replace("/");
                return;
            }
            const me = await response.json();
            if (me.role === "admin") {
                location.replace("/admin.html");
                return;
            }

            document.getElementById("avatar").textContent = me.name.slice(0, 1);
            document.getElementById("badge-name").textContent = me.name;
            document.getElementById("badge-login-id").textContent = me.login_id;
            document.getElementById("welcome").textContent = `ようこそ、${me.name} さん`;
            document.getElementById("login-id").textContent = me.login_id;
            document.getElementById("login-dt").textContent = formatDate(me.login_dt);
            document.getElementById("expires-dt").textContent = formatDate(me.expires_dt);
            document.getElementById("points").textContent = `${me.task_points} pt`;

            const users = await fetch("/api/users").then((r) => r.json());
            document.getElementById("member-count").textContent = users.length;
            document.getElementById("users").replaceChildren(...users.map((user) => memberRow(user, me)));

            document.getElementById("content").hidden = false;
        }

        document.getElementById("logout-button").addEventListener("click", async () => {
            await fetch("/api/logout", { method: "POST" });
            location.replace("/");
        });

        // スマートフォンでサイドバーを開閉する
        document.getElementById("mobile-menu").addEventListener("click", () => {
            document.getElementById("sidebar").classList.toggle("open");
        });

        load();
    </script>

</body>
</html>
