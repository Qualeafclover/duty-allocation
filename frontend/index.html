<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | 納得のできる抽選システム</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-brand">
            <div class="brand-mark">抽</div>
            <div>
                <h1>納得のできる抽選システム</h1>
                <p>ユーザーIDとパスワードでログインしてください</p>
            </div>
        </div>

        <form id="login-form">
            <div class="field">
                <label for="login-id">ユーザーID</label>
                <input type="text"
                       id="login-id"
                       name="login_id"
                       placeholder="例: alice"
                       autocomplete="username"
                       required>
            </div>

            <div class="field">
                <label for="password">パスワード</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="例: alice-password"
                       autocomplete="current-password"
                       required>
            </div>

            <p id="error" class="form-error" role="alert"></p>

            <button type="submit" id="login-button" class="primary-btn block-btn">ログイン</button>
        </form>
    </main>

    <script>
        const destination = (me) => me.role === "admin" ? "/admin.html" : "/home.html";

        // ログイン済みならフォームを飛ばして、管理者ページまたはマイページへ
        fetch("/api/me").then(async (response) => {
            if (response.ok) location.replace(destination(await response.json()));
        });

        const form = document.getElementById("login-form");
        const error = document.getElementById("error");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            error.textContent = "";
            button.disabled = true;
            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        login_id: document.getElementById("login-id").value,
                        password: document.getElementById("password").value,
                    }),
                });
                if (response.ok) {
                    const meResponse = await fetch("/api/me");
                    if (!meResponse.ok) throw new Error("ログイン情報を取得できませんでした");
                    location.replace(destination(await meResponse.json()));
                    return;
                }
                const body = await response.json().catch(() => ({}));
                error.textContent = typeof body.detail === "string"
                    ? body.detail
                    : "ログインに失敗しました";
            } catch {
                error.textContent = "サーバーに接続できませんでした";
            }
            button.disabled = false;
        });
    </script>

</body>
</html>
