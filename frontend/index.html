<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログインページ</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: white;
            width: 320px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #2563eb;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: wait;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            min-height: 1.2em;
            margin: 0 0 10px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>納得のできる抽選システム</h1>

        <h2>ログイン</h2>

        <form id="login-form">
            <select id="role" name="role" aria-label="ログイン種別">
                <option value="user">ユーザーとしてログイン</option>
                <option value="admin">管理者としてログイン</option>
            </select>
            <input type="text"
                   id="login-id"
                   name="login_id"
                   placeholder="ユーザーID"
                   autocomplete="username"
                   required>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="パスワード"
                   autocomplete="current-password"
                   required>

            <p id="error" class="error" role="alert"></p>

            <button type="submit" id="login-button">ログイン</button>
        </form>

        <p>新規アカウント登録はこちら</p>

    </div>

    <script>
        const destinationFor = (role) => role === "admin" ? "/admin.html" : "/home.html";

        // Already logged in: skip the form
        fetch("/api/me").then(async (response) => {
            if (response.ok) {
                const me = await response.json();
                location.replace(destinationFor(me.role));
            }
        });

        const form = document.getElementById("login-form");
        const error = document.getElementById("error");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            error.textContent = "";
            button.disabled = true;
            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        login_id: document.getElementById("login-id").value,
                        password: document.getElementById("password").value,
                        role: document.getElementById("role").value,
                    }),
                });
                if (response.ok) {
                    location.replace(destinationFor(document.getElementById("role").value));
                    return;
                }
                const body = await response.json().catch(() => ({}));
                error.textContent = typeof body.detail === "string"
                    ? body.detail
                    : "ログインに失敗しました";
            } catch {
                error.textContent = "サーバーに接続できませんでした";
            }
            button.disabled = false;
        });
    </script>

</body>
</html>
